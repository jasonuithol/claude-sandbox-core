# chess.conf — chess engine development domain.
#
# Sourced by both bin/start.sh (host) and core/entrypoint.sh (container).
# Use only $HOME-relative paths or absolute paths — $HOME means different
# things on each side, but in practice every reference here is host-side.

# Required host repos to bring up before launching the sandbox.
MCP_REPOS=(
    "$HOME/Projects/ai-agent-mcps/mcp-chess"
)

# Optional repos: started if cloned; ignored silently if absent. mcp-dosre
# is cross-domain (binary analysis), useful from any sandbox — handy here
# for poking at engine binaries directly. mcp-c likewise — most chess
# engines under test will be C/C++ projects, and the c-build / c-knowledge
# services are useful alongside the chess-specific ones.
OPTIONAL_REPOS=(
    "$HOME/Projects/ai-agent-mcps/mcp-dosre"
    "$HOME/Projects/ai-agent-mcps/mcp-c"
    "$HOME/Projects/ai-agent-mcps/mcp-db"
)

# Required MCP services to register inside the container. "name|url" pairs.
SERVICES=(
    "chess-engine|http://localhost:5180/mcp"
    "chess-knowledge|http://localhost:5186/mcp"
)

# Probed at register time; registered only if reachable. Pairs with
# OPTIONAL_REPOS — if the repo is present, start.sh boots its services
# (so the probe will see them); if absent, the probe simply fails.
OPTIONAL_SERVICES=(
    "dos-re|http://localhost:5175/mcp"
    "dos-re-knowledge|http://localhost:5176/mcp"
    "c-build|http://localhost:5192/mcp"
    "c-knowledge|http://localhost:5194/mcp"
    "db-postgres|http://localhost:5188/mcp"
    "db-mssql|http://localhost:5189/mcp"
)

# Read-only mounts into the sandbox container. host:container[:opts]
# Uncomment once mcp-chess/docs/ exists.
EXTRA_MOUNTS=(
    # "$HOME/Projects/ai-agent-mcps/mcp-chess/docs:/workspace/docs:ro,Z"
)

# Extra env vars passed into the container (KEY=VALUE).
EXTRA_ENV=()
